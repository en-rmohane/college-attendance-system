{% extends 'base.html' %}

{% block title %}Login - SBTIM Attendance{% endblock %}

{% block content %}
<div class="login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="glass-card p-4 p-md-5 floating">
                    <div class="text-center mb-5">
                        <div class="d-inline-flex align-items-center justify-content-center glass-card p-3 mb-4"
                            style="width: 80px; height: 80px; border-color: #fbbf24;">
                            <i class="bi bi-shield-lock" style="font-size: 2.5rem; color: #fbbf24;"></i>
                        </div>
                        <h2 class="fw-bold text-white mb-2">Secure Login</h2>
                        <p class="text-label small opacity-75">Please enter your credentials to continue</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-label small text-uppercase tracking-wider">Email
                                or Roll Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-0 text-muted"><i
                                        class="bi bi-person"></i></span>
                                <input type="text" class="form-control glass-input" name="email"
                                    placeholder="e.g. 2101CSE001" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label
                                class="form-label fw-semibold text-label small text-uppercase tracking-wider">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-0 text-muted"><i
                                        class="bi bi-key"></i></span>
                                <input type="password" class="form-control glass-input" name="password"
                                    placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 px-1">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label small text-label" for="rememberMe">Remember me</label>
                            </div>
                            <a href="{{ url_for('forgot_password') }}"
                                class="small text-accent-gold text-decoration-none" style="color: #fbbf24;">Forgot
                                Password?</a>
                        </div>

                        <button type="submit" class="btn btn-premium w-100 mb-4">
                            Sign In <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="text-label small mb-0 opacity-50">Trouble logging in? Contact Administration</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Local Override for Navigation to keep it clean on Login */
    .navbar {
        position: absolute;
        top: 0;
        width: 100%;
        z-index: 1000;
    }

    .tracking-wider {
        letter-spacing: 2px;
    }

    .text-accent-gold {
        color: #fbbf24;
    }

    .text-label {
        color: var(--text-label);
    }
</style>
{% endblock %}
