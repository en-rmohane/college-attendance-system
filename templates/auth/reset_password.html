{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Reset Password</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">
                    Enter the OTP sent to your email and set your new password.
                </p>

                <form method="POST" action="{{ url_for('reset_password') }}">
                    <input type="hidden" name="email" value="{{ email }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" value="{{ email }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">OTP Code</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                            <input type="text" class="form-control" name="otp" placeholder="Enter 6-digit OTP" required maxlength="6">
                        </div>
                        <div class="form-text">Check your email for the OTP code</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password" placeholder="Enter new password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" name="confirm_password" placeholder="Confirm new password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                        <i class="bi bi-check-circle me-2"></i>Reset Password
                    </button>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Back to Forgot Password
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
