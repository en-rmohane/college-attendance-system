{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-warning text-dark text-center py-3">
                <h4 class="mb-0"><i class="bi bi-key me-2"></i>Forgot Password</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">
                    Enter your registered email address. We'll send you an OTP to reset your password.
                </p>

                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" name="email" placeholder="Enter your registered email" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold">
                        <i class="bi bi-send me-2"></i>Send OTP
                    </button>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('login') }}" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
